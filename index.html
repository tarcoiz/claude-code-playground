<!DOCTYPE html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0b0d12" />
    <title>Stopwatch</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@500;700&family=Space+Grotesk:wght@500;600&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="bg-aurora" aria-hidden="true">
      <span class="blob blob-1"></span>
      <span class="blob blob-2"></span>
      <span class="blob blob-3"></span>
    </div>

    <main class="container">
      <header class="header">
        <span class="status-dot" aria-hidden="true"></span>
        <h1 class="title">Stopwatch</h1>
      </header>

      <div class="display-wrap">
        <div
          class="display"
          id="display"
          aria-live="polite"
          aria-atomic="true"
        >
          <span class="seg seg-min">00</span>
          <span class="sep">:</span>
          <span class="seg seg-sec">00</span>
          <span class="sep">.</span>
          <span class="seg seg-cs">00</span>
        </div>
      </div>

      <div class="controls">
        <button id="toggleBtn" class="btn btn-primary" type="button">
          <span class="icon icon-play" aria-hidden="true">
            <svg viewBox="0 0 24 24" width="18" height="18">
              <path d="M8 5v14l11-7z" fill="currentColor" />
            </svg>
          </span>
          <span class="icon icon-stop" aria-hidden="true">
            <svg viewBox="0 0 24 24" width="18" height="18">
              <rect x="6" y="5" width="4" height="14" rx="1" fill="currentColor" />
              <rect x="14" y="5" width="4" height="14" rx="1" fill="currentColor" />
            </svg>
          </span>
          <span class="label" data-start="スタート" data-stop="ストップ">スタート</span>
        </button>
        <button id="resetBtn" class="btn btn-secondary" type="button">
          <span class="icon" aria-hidden="true">
            <svg viewBox="0 0 24 24" width="18" height="18">
              <path
                d="M12 5V2L7 6l5 4V7a5 5 0 1 1-5 5H5a7 7 0 1 0 7-7z"
                fill="currentColor"
              />
            </svg>
          </span>
          <span class="label">リセット</span>
        </button>
      </div>
    </main>

    <script src="script.js"></script>
  </body>
</html>
